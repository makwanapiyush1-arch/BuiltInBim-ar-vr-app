name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk BIM-AR-VR-Viewer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BIM-AR-VR-Viewer
          path: BIM-AR-VR-Viewer.apk
      # Publishes the APK as a GitHub Release so it can be downloaded straight to a phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BIM AR VR Viewer build ${{ github.run_number }}
          files: BIM-AR-VR-Viewer.apk
