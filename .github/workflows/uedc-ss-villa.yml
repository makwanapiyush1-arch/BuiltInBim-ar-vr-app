name: UEDC_SS Villa (Android + iOS)
on:
  push:
    paths: ['uedc_ss_villa/**', '.github/workflows/uedc-ss-villa.yml']
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    working-directory: uedc_ss_villa
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Signed with the debug key (see android/app/build.gradle.kts), so it installs straight away.
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk UEDC_SS-Villa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UEDC_SS-Villa-android
          path: uedc_ss_villa/UEDC_SS-Villa.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      # No Apple signing on CI: this proves the iOS app compiles and gives an unsigned .ipa
      # that can be signed with your own Apple ID / developer account (see README.md).
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr UEDC_SS-Villa-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: UEDC_SS-Villa-ios-unsigned
          path: uedc_ss_villa/UEDC_SS-Villa-unsigned.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # Publishes both files on the Releases page so they can be downloaded straight to a phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: uedc-ss-villa-${{ github.run_number }}
          name: UEDC_SS Villa build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: |
            out/UEDC_SS-Villa.apk
            out/UEDC_SS-Villa-unsigned.ipa
